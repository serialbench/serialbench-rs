[package]
name = "serialbench-rs"
version = "0.1.0"
edition = "2021"
description = "Rust harness of the cross-language serialbench family — canonical fixtures, shared data schema"
license = "BSD-2-Clause"

[dependencies]
leptris = "1.4"
yeptris = "0.6"
teptris = "0.1"

# native-ecosystem competitors
serde_json = "1"
simd-json = "0.18"
quick-xml = "0.42"
roxmltree = "0.21"
yaml-rust2 = "0.13"
toml = "1"

[profile.release]
opt-level = 3
